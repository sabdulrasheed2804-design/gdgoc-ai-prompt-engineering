<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Prompt Engineering Cluster</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="site-header__brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <div>
        <h1>AI Prompt Engineering Cluster</h1>
        <p class="site-header__tagline">GDGoC — 8 weeks, live-graded prompt labs</p>
      </div>
    </div>
    <button id="sign-in" class="btn btn--primary">Continue</button>
  </header>
  <nav id="main-nav" class="site-nav" hidden>
    <a href="#dashboard" data-route="dashboard">Dashboard</a>
    <a href="#roadmap" data-route="roadmap">Roadmap</a>
  </nav>
  <main id="app">
    <div class="empty-state">
      <h2>Welcome</h2>
      <p>Sign in with Google to see the 8-week roadmap and start your first graded lab.</p>
    </div>
  </main>
  <footer class="site-footer">
    <p>GDGoC · AI Prompt Engineering Cluster</p>
  </footer>
  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js"
      }
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
